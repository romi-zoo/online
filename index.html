<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to the Virtual Zoo — explore amazing animals and habitats from home.">
  <title>Virtual Zoo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="entrance" id="entrance">
    <div class="scene"></div>

    <div class="leaf leaf-1">🍃</div>
    <div class="leaf leaf-2">🍂</div>
    <div class="leaf leaf-3">🍃</div>
    <div class="butterfly butterfly-1">🦋</div>
    <div class="butterfly butterfly-2">🦋</div>
    <div class="bird bird-1">🕊️</div>
    <div class="bird bird-2">🕊️</div>

    <section class="welcome" aria-labelledby="welcome-title">
      <p class="eyebrow">A world of wildlife awaits</p>
      <h1 id="welcome-title">Welcome to the<br>Virtual Zoo!</h1>
      <p class="intro">Discover amazing animals, explore different habitats,<br class="desktop"> and experience nature up close — all from home.</p>
      <button class="enter" id="enterButton" type="button">
        <span class="paw">🐾</span>
        <span>Enter the Zoo</span>
        <span class="arrow">→</span>
      </button>
    </section>

    <div class="hint">Scroll to explore</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
