<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Romi Zoo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="entrance" id="entrance">
  <div class="scene" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <section class="welcome" aria-label="Romi Zoo welcome">
    <p class="welcome-title">Welcome to<br>Romi Zoo</p>
    <p class="welcome-text">A wild adventure awaits</p>
    <button class="enter-button" id="enterButton" type="button">
      <span>🐾</span><span>Enter the Zoo</span><b>→</b>
    </button>
  </section>
  <div class="transition" id="transition" aria-hidden="true"></div>
</main>
<script src="script.js"></script>
</body>
</html>
