<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Zoo — Aquarium</title>
<link rel="stylesheet" href="zoo.css">
<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#061b20;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}

.aquarium-page{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#061b20;
  display:flex;
  align-items:center;
  justify-content:center;
}

.aquarium-scroll{
  width:100%;
  height:100%;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-x pan-y;
  padding:12px;
}

.aquarium-map{
  position:relative;
  width:min(1536px,100%);
  min-width:1100px;
  margin:0 auto;
  line-height:0;
}

.aquarium-map img{
  display:block;
  width:100%;
  height:auto;
  border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,.45);
  user-select:none;
  -webkit-user-drag:none;
}

.region-label{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:2;
  white-space:nowrap;
  line-height:1;
  pointer-events:none;
}

.sharks{left:22%;top:24%}
.rays{left:40%;top:12%}
.turtles{left:63%;top:21%}
.jellyfish{left:82%;top:21%}
.coral{left:78%;top:39%}
.tropical{left:18%;top:43%}
.octopus{left:78%;top:62%}
.seahorses{left:20%;top:69%}
.dolphins{left:50%;top:35%}
.penguins{left:63%;top:62%}

@media(max-width:600px){
  .aquarium-scroll{
    padding:5px;
    display:block;
  }

  .aquarium-map{
    width:1100px;
    min-width:1100px;
    margin:0;
  }
}
</style>
</head>
<body>
<main class="aquarium-page">
  <div class="aquarium-scroll">
    <div class="aquarium-map">
      <img src="assets/aquarium.png" alt="Illustrated map of the Aquarium region" draggable="false">

      <div class="habitat region-label sharks">🦈 Sharks</div>
      <div class="habitat region-label rays">🐟 Rays</div>
      <div class="habitat region-label turtles">🐢 Sea Turtles</div>
      <div class="habitat region-label jellyfish">🪼 Jellyfish</div>
      <div class="habitat region-label coral">🪸 Coral Reef</div>
      <div class="habitat region-label tropical">🐠 Tropical Fish</div>
      <div class="habitat region-label octopus">🐙 Octopus</div>
      <div class="habitat region-label seahorses">🐴 Seahorses</div>
      <div class="habitat region-label dolphins">🐬 Dolphins</div>
      <div class="habitat region-label penguins">🐧 Penguins</div>
    </div>
  </div>
</main>
</body>
</html>
