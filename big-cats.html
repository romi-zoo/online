<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Zoo — Big Cats</title>
<link rel="stylesheet" href="zoo.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#071b14}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.big-cats-page{width:100vw;height:100vh;overflow:hidden;background:#071b14;display:flex;align-items:center;justify-content:center;padding:0}
.big-cats-scroll{width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center;padding:12px}
.big-cats-map{position:relative;width:min(1536px,100%);flex:none;line-height:0}
.big-cats-map img{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.45)}

/* Use the same .habitat styling as the main zoo map; these rules only position the labels. */
.region-label{position:absolute;transform:translate(-50%,-50%);z-index:2;white-space:nowrap;line-height:1}
.lions{left:30%;top:17%}
.tigers{left:70%;top:18%}
.jaguars{left:17%;top:37%}
.panthers{left:78%;top:42%}
.fishing{left:20%;top:68%}
.cheetahs{left:67%;top:66%}

.back{position:absolute;left:2.5%;bottom:3%;z-index:3;display:inline-flex;align-items:center;gap:.45em;padding:.65em .95em;border:2px solid rgba(255,255,255,.3);border-radius:14px;background:linear-gradient(#87582b,#5d3519);color:#fff;text-decoration:none;font-weight:800;font-size:clamp(12px,1.6vw,24px);line-height:1;box-shadow:0 4px 10px rgba(0,0,0,.38);text-shadow:0 2px 3px rgba(0,0,0,.65)}
.back:hover{transform:translateY(-1px)}
@media(max-width:600px){
  .big-cats-scroll{display:block;padding:5px}
  .big-cats-map{width:1100px;min-width:1100px}
  .back{font-size:16px}
}
</style>
</head>
<body>
<main class="big-cats-page">
  <div class="big-cats-scroll">
    <div class="big-cats-map">
    <img src="assets/big-cats.png" alt="Illustrated map of the Big Cats region" draggable="false">

    <div class="habitat region-label lions">🐾 Lions</div>
    <div class="habitat region-label tigers">🐾 Tigers</div>
    <div class="habitat region-label jaguars">🐾 Jaguars</div>
    <div class="habitat region-label panthers">🐾 Panthers</div>
    <div class="habitat region-label fishing">🐾 Fishing Cat</div>
    <div class="habitat region-label cheetahs">🐾 Cheetahs</div>

      <a class="back" href="zoo.html" aria-label="Back to Zoo Map">← Back to Zoo Map</a>
    </div>
  </div>
</main>
</body>
</html>
