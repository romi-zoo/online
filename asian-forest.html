<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asian Forest</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #102015;
    }

    body {
      overflow-x: hidden;
    }

    .map-container {
      width: 100%;

      max-width: 100%;

<body>
  <main class="map-container">
    <img src="assets/asian-forest.png" alt="Asian Forest zoo map">

</html>
